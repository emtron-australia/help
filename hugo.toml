baseURL = 'https://docs.emtronaustralia.com.au/'
languageCode = 'en-us'
title = 'Emtron Resource Centre'
theme = 'hugo-theme-relearn'
disablePathToLower = false
pluralizeListTitles = false

[params]
  menu_style = "slide-menu"
  editURL = "https://github.com/emtron-australia/help/tree/master/content/${FilePath}"
  disableRootBreadcrumb = true
  disableInlineCopyToClipBoard = true

[markup.renderer]
  unsafe = true

[markup.goldmark.renderer]
  unsafe = true

[markup.goldmark.parser.attribute]
  block = true

[[params.themeVariant]]
  identifier = 'emtron'

[caches]
[caches.images]
  dir = ':cacheDir/images'

# This is so that the image path works when previewing markdown and in the final build
[[module.mounts]]
  source = 'static'
  target = 'static'

[[module.mounts]]
  source = 'img'
  target = 'static/img'

# Lean page used by Display Studio / other PC apps (no menu, search, or chrome).
# URL: <page>/index.embed.html
# notAlternative: keep embed out of <link rel="alternate"> so it does not
# compete with the Relearn print format (both are text/html).
[outputFormats]
  [outputFormats.embed]
    name = 'embed'
    baseName = 'index.embed'
    isHTML = true
    mediaType = 'text/html'
    permalinkable = false
    noUgly = true
    notAlternative = true

[outputs]
  home = [
    'html',
  ]
  page = [
    'html',
    'rss',
    'print',
    'embed',
  ]
  # print on sections restores “print this chapter” for section indexes
  section = [
    'html',
    'print',
    'embed',
  ]
